
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mototaxi Colombia</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f4;
      color: #183326;
      margin: 0;
      padding: 24px;
      text-align: center;
    }

    main {
      max-width: 420px;
      margin: 40px auto;
      padding: 28px 20px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 14px #0001;
    }

    h1 {
      color: #168447;
    }

    button {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      background: #168447;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:last-child {
      background: #f0a927;
      color: #222;
    }
  </style>
</head>
<body>
  <main>
    <h1>🏍️ Mototaxi Colombia</h1>
    <p>Muévete y envía tus productos en Montería.</p>

    <button onclick="alert('Pronto podrás solicitar un viaje')">
      Solicitar un viaje
    </button>

    <button onclick="alert('Pronto podrás pedir un domicilio')">
      Enviar un domicilio
    </button>
  </main>
</body>
</html>
